name: Java Build, Test

on:
  workflow_call:

jobs:
  build:

    runs-on: ubuntu-latest

    services:
      docker:
        image: docker:19.03.12
        options: --privileged # allow exec of Docker-in-Docker
        ports:
          - 2375:2375 # Docker port exposed

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up JDK 25
      uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven
    - name: Set up Docker
      run: |
          docker info
    - name: Build with Maven
      run: mvn -B --no-transfer-progress install --file pom.xml
    - name: Save Maven build artifacts to cache
      uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: |
          ~/.m2/repository/org/eclipse/daanse
          **/target
        key: build-${{ runner.os }}-${{ github.sha }}
    - name: Upload Test Reports
      if:  always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: Test-reports
        path: |
          **/test-reports/*/TEST-*.xml
