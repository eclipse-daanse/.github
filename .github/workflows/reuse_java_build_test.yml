# Shared Java build + per-module test matrix for eclipse-daanse.
# All inputs are optional; defaults reproduce the previous single-job behaviour.
#
# Two contracts that must not break:
#   * the `build` job saves cache key build-${{ runner.os }}-${{ github.sha }}
#     (paths ~/.m2/repository/org/eclipse/daanse and **/target) exactly once -
#     reuse_java_deploy.yml restores it with fail-on-cache-miss: true.
#   * the first job keeps the id `build` and declares no `name:`, so the check
#     context stays `<callerJobId> / build` for branch protection.

name: Java Build, Test

on:
  workflow_call:
    inputs:
      java-version:
        description: 'JDK version for build and test jobs.'
        required: false
        type: string
        default: '25'
      java-distribution:
        description: 'JDK distribution passed to actions/setup-java.'
        required: false
        type: string
        default: 'temurin'
      runs-on:
        description: 'Runner label for all jobs.'
        required: false
        type: string
        default: 'ubuntu-latest'
      matrix-mode:
        description: >-
          reactor (default) = modules that compiled tests into target/test-classes;
          single = one job over the whole reactor.
        required: false
        type: string
        default: 'reactor'
      test-goal:
        description: >-
          Must be verify or later: bnd-testing-maven-plugin binds to
          integration-test, so `test` would skip every OSGi integration test.
        required: false
        type: string
        default: 'verify'
      build-maven-args:
        description: 'Extra arguments appended to the build job mvn invocation.'
        required: false
        type: string
        default: ''
      test-maven-args:
        description: 'Extra arguments appended to each test job mvn invocation.'
        required: false
        type: string
        default: ''
      max-parallel:
        description: 'Cap on concurrently running test jobs.'
        required: false
        type: number
        default: 256
      build-timeout-minutes:
        description: 'Timeout for the build job.'
        required: false
        type: number
        default: 60
      test-timeout-minutes:
        description: 'Timeout for each test job.'
        required: false
        type: number
        default: 60
      artifact-retention-days:
        description: 'Retention for the per-module test report artifacts (minimum 1).'
        required: false
        type: number
        default: 1
      docker-check:
        description: >-
          Fail fast if the host Docker daemon is unavailable. The old
          `services: docker` dind container was a no-op and has been removed.
        required: false
        type: boolean
        default: false
      require-tests:
        description: 'Fail the Test Results job if no JUnit XML was produced at all.'
        required: false
        type: boolean
        default: true
      fail-on-test-failure:
        description: 'Fail Test Results when any JUnit XML reports a failure or error.'
        required: false
        type: boolean
        default: true
      pr-comment:
        description: >-
          Post a PR comment with the summary. Needs pull-requests: write on the
          caller token; harmless when unavailable.
        required: false
        type: boolean
        default: false

jobs:

  # Build once; also computes the test matrix.
  build:
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.build-timeout-minutes }}
    permissions:
      contents: read

    outputs:
      # Always a valid non-empty matrix; the sentinel entry is never expanded
      # because `test` is gated on has-modules.
      matrix: ${{ steps.modules.outputs.matrix }}
      has-modules: ${{ steps.modules.outputs.has-modules }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up JDK ${{ inputs.java-version }}
      uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
      with:
        java-version: ${{ inputs.java-version }}
        distribution: ${{ inputs.java-distribution }}
        cache: maven

    # -DskipTests (never -Dmaven.test.skip=true, which would skip test
    # compilation and break bnd-maven-plugin:test-jar). The bnd skips keep the
    # OSGi resolve/test round in the test job where it belongs.
    - name: Build with Maven (no tests)
      shell: bash
      env:
        EXTRA_ARGS: ${{ inputs.build-maven-args }}
      run: |
        set -euo pipefail
        # shellcheck disable=SC2086  # EXTRA_ARGS is intentionally word-split
        mvn -B --no-transfer-progress install --file pom.xml \
            -DskipTests \
            -Dbnd.testing.skip=true \
            -Dbnd.resolve.skip=true \
            ${EXTRA_ARGS}

    # Saved before anything else can touch target/, and only here.
    - name: Save Maven build artifacts to cache
      uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: |
          ~/.m2/repository/org/eclipse/daanse
          **/target
        key: build-${{ runner.os }}-${{ github.sha }}

    - name: Determine test module matrix
      id: modules
      shell: bash
      env:
        MATRIX_MODE: ${{ inputs.matrix-mode }}
      run: |
        set -euo pipefail

        # A module has tests iff the build compiled some into target/test-classes.
        # That single signal is reactor-derived (a directory the build never
        # visited has no target/), skips aggregators, and covers the bnd OSGi
        # tests, whose *.integration.* classes are compiled here too.
        if [ "$MATRIX_MODE" = single ]; then
          modules=.
        else
          modules=$(find . -type f -path '*/target/test-classes/*' -name '*.class' \
                    | sed 's|/target/test-classes/.*||; s|^\./||' | sort -u)
        fi

        if [ -z "$modules" ]; then
          # A skipped test job does not fail the workflow, so never report a
          # green build when test sources plainly exist.
          if find . -type d -path '*/src/test/java' -not -path '*/target/*' -print -quit | grep -q .; then
            echo "::error::No compiled tests found although this repository has test sources. Refusing a green, untested build."
            exit 1
          fi
          echo "has-modules=false" >> "$GITHUB_OUTPUT"
          echo 'matrix={"module":["-none-"]}' >> "$GITHUB_OUTPUT"
          echo 'No modules with tests.' >> "$GITHUB_STEP_SUMMARY"
          exit 0
        fi

        echo "has-modules=true" >> "$GITHUB_OUTPUT"
        jq -Rsc 'split("\n") | map(select(length > 0)) | {module: .}' <<<"$modules" \
          | sed 's/^/matrix=/' >> "$GITHUB_OUTPUT"
        printf '* `%s`\n' $modules >> "$GITHUB_STEP_SUMMARY"

  # One job per module. No continue-on-error: a red cell must fail the workflow
  # so the callers' `needs: build_test` blocks deploy.
  test:
    name: Test ${{ matrix.module }}
    needs: build
    if: needs.build.outputs.has-modules == 'true'
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.test-timeout-minutes }}
    permissions:
      contents: read

    strategy:
      fail-fast: false            # do NOT cancel siblings; does NOT mask failure
      max-parallel: ${{ inputs.max-parallel }}
      matrix: ${{ fromJson(needs.build.outputs.matrix) }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up JDK ${{ inputs.java-version }}
      uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
      with:
        java-version: ${{ inputs.java-version }}
        distribution: ${{ inputs.java-distribution }}
        cache: maven

    # Restore only - the build job is the single writer of this key.
    - name: Restore Maven build artifacts
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: |
          ~/.m2/repository/org/eclipse/daanse
          **/target
        key: build-${{ runner.os }}-${{ github.sha }}
        fail-on-cache-miss: true

    - name: Verify Docker daemon
      if: ${{ inputs.docker-check }}
      run: docker info

    # -pl from the repo root, not `cd <module>`: keeps ${revision} parent
    # resolution and maven.multiModuleProjectDirectory identical to the build.
    # bnd-baseline (downloads the last release per module) and editorconfig
    # (covered elsewhere) are skipped here.
    - name: Run tests for ${{ matrix.module }}
      shell: bash
      env:
        MODULE: ${{ matrix.module }}
        TEST_GOAL: ${{ inputs.test-goal }}
        EXTRA_ARGS: ${{ inputs.test-maven-args }}
      run: |
        set -euo pipefail
        args=(-B --no-transfer-progress -Dbnd.baseline.skip=true -Deditorconfig.skip=true)
        if [ "$MODULE" != "." ]; then
          args+=(-pl "$MODULE")
        fi
        # shellcheck disable=SC2086  # EXTRA_ARGS is intentionally word-split
        mvn "${args[@]}" ${EXTRA_ARGS} "$TEST_GOAL"

    # Both report shapes: surefire-reports and the bnd test-reports/<runName>.
    - name: Upload test reports for ${{ matrix.module }}
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: test-results-${{ strategy.job-index }}
        path: |
          ${{ matrix.module }}/target/surefire-reports/TEST-*.xml
          ${{ matrix.module }}/target/failsafe-reports/TEST-*.xml
          ${{ matrix.module }}/target/test-reports/*/TEST-*.xml
        if-no-files-found: ignore
        retention-days: ${{ inputs.artifact-retention-days }}

  # ---------------------------------------------------------------------------
  # Publish and gate on the aggregated JUnit results.
  # No `permissions:` block: a called workflow may only narrow the caller's
  # token, and requesting checks:write would hard-fail callers whose org default
  # is read-only.
  # ---------------------------------------------------------------------------
  test-results:
    name: Test Results
    needs: [build, test]
    if: always()

    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      if: needs.build.outputs.has-modules == 'true'

    - name: Download all test reports
      if: needs.build.outputs.has-modules == 'true'
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        pattern: test-results-*
        path: test-results

    # Renders the check/summary AND gates: fail_on_failure catches a shard whose
    # mvn exit code was masked, require_tests catches a run that produced no XML.
    - name: Publish test report
      if: needs.build.outputs.has-modules == 'true'
      uses: mikepenz/action-junit-report@a9170d5795813c01ab4901ffb045b52bab4ab09d # v6.5.0
      with:
        report_paths: 'test-results/**/TEST-*.xml'
        check_name: 'Test Results'
        token: ${{ github.token }}
        fail_on_failure: ${{ inputs.fail-on-test-failure }}
        require_tests: ${{ inputs.require-tests }}
        detailed_summary: true
        group_suite: true
        include_time_in_summary: true
        truncate_stack_traces: false
        job_summary: true
        comment: ${{ inputs.pr-comment }}
        updateComment: true
